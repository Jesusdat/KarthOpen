; Combate cuerpo a cuerpo del jugador. Tiempos en segundos, distancias en metros.
; Cada ataque tiene tres fases: preparación (antes de pegar), activo (cuando el golpe
; hace daño) y recuperación (no puedes hacer otra cosa, salvo encadenar el combo).

[jugador]
vida=100.0
invulnerable_tras_golpe=0.45  ; después de recibir un golpe, no te vuelven a pegar enseguida
aturdido=0.35                 ; tiempo sin control al recibir un golpe
empuje_recibido=5.0           ; velocidad con la que te empuja un golpe
reaparecer=3.0                ; segundos tras caer antes de volver al inicio

[ataque_ligero]
dano=12.0
aturdir=12.0          ; cuánto baja el aguante del enemigo (si llega a 0, se aturde)
estamina=12.0
preparacion=0.12
activo=0.12
recuperacion=0.3
ventana_combo=0.3     ; al final de la recuperación puedes encadenar el siguiente golpe
combo=[1.0, 1.1, 1.4] ; multiplicador de daño de cada golpe del combo (3 golpes)
alcance=1.3           ; distancia del centro del golpe al frente del jugador
radio=1.2             ; tamaño de la zona que golpea
avance=2.5            ; impulso hacia adelante al golpear
empuje=1.5            ; cuánto empuja al enemigo

[ataque_pesado]
carga=0.35            ; mantener el botón esto para que sea pesado
dano=32.0
aturdir=45.0
estamina=26.0
preparacion=0.3
activo=0.15
recuperacion=0.55
alcance=1.5
radio=1.5
avance=4.5
empuje=6.0

[bloqueo]
reduccion=0.8         ; bloqueando recibes 20 % del daño
estamina_por_dano=1.3 ; el daño bloqueado se cobra en estamina; si se acaba, te rompen la guardia
angulo=120.0          ; solo bloqueas lo que viene de frente
velocidad=0.45        ; multiplicador de velocidad mientras bloqueas
guardia_rota=0.9      ; segundos aturdido si te rompen la guardia

[fijar]
distancia=22.0        ; alcance para fijar un enemigo
angulo=75.0           ; qué tan de frente a la cámara debe estar
soltar=32.0           ; si se aleja más que esto, se suelta solo

[sensacion]
pausa_golpe=0.055     ; congelado breve al conectar un golpe (hitstop)
pausa_pesado=0.09
sacudida=0.18         ; sacudida de cámara al conectar
sacudida_recibir=0.3
mostrar_objetivo=4.0  ; segundos que se ve la barra del enemigo después de pegarle
