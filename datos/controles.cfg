; Controles del juego. Cada acción lleva teclas (nombres de Godot: "W", "Shift", "Space"...),
; botones del ratón ("raton_izq", "raton_der", "rueda_arriba", "rueda_abajo") y botones
; del control ("joy_0" = A/Cruz, "joy_1" = B/Círculo...). Cambia aquí sin tocar código.

[adelante]
teclas=["W", "Up"]
ejes=["joy_eje_1_-"]

[atras]
teclas=["S", "Down"]
ejes=["joy_eje_1_+"]

[izquierda]
teclas=["A", "Left"]
ejes=["joy_eje_0_-"]

[derecha]
teclas=["D", "Right"]
ejes=["joy_eje_0_+"]

[correr]
teclas=["Shift"]
botones=["joy_8"]

[saltar]
teclas=["Space"]
botones=["joy_0"]

[esquivar]
teclas=["Ctrl", "C"]
botones=["joy_1"]

[acercar]
botones=["rueda_arriba"]

[alejar]
botones=["rueda_abajo"]

[soltar_raton]
teclas=["Escape"]
