; Criaturas en 3D (tiempo real). El nombre, la experiencia y el color salen de
; datos/monstruos.cfg (base); aquí van los números del combate en 3D.
; Cada criatura tiene una lista de ataques; cada ataque es su propia sección.

[nidal]
base="nidal"
modelo="res://modelos/nidal.json"
escala=2.4             ; tamaño: metros por unidad del modelo (Karth usaba 1 casilla = 1.9 m)
giro_modelo=180.0      ; grados para que el frente del modelo mire hacia donde camina
radio=0.7
alto=1.3
vida=60.0
aguante=40.0           ; al bajar a 0 por golpes, queda aturdido
recupera_aguante=12.0  ; por segundo, si no le pegan
aturdido=1.2
velocidad=3.4
velocidad_patrulla=1.1
giro=8.0
vision=15.0            ; distancia a la que te ve
correa=30.0            ; si se aleja esto de su guarida, regresa y se cura
ataques=["nidal_mordida", "nidal_salto"]

[nidal_mordida]
distancia_min=0.0
distancia_max=2.3
preparacion=0.6        ; el aviso: se echa para atrás antes de morder
activo=0.15
recuperacion=0.75
dano=14.0
alcance=1.2
radio=1.0
avance=3.0
peso=3                 ; qué tan seguido lo elige frente a otros ataques

[nidal_salto]
distancia_min=3.5
distancia_max=7.5
preparacion=0.85
activo=0.4
recuperacion=1.0
dano=22.0
alcance=0.9
radio=1.3
avance=11.0
salto=4.0
peso=2
espera=4.0             ; segundos antes de poder repetirlo
