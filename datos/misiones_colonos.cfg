[000]

title="Plaga en las llanuras"
text="Los Nidales se acercan a las murallas cada noche. Despeja las Llanuras: elimina 5 Nidales para que los colonos puedan salir por agua."
done_text="Gracias. Algo raro: los Nidales no atacan por hambre. Atacan como si algo los llamara."
type="kill"
target="nidal"
zona="llanuras"
count=5
reward_cr=40
reward_xp=60

[001]

title="Corredores en el camino"
text="Unas bestias veloces asaltan a los mensajeros. Elimina 4 Corredores antes de que corten la ruta a las Grietas."
done_text="Eran las avanzadillas de la Progenie. Cada vez salen más rápido y más organizados."
type="kill"
target="corredor"
zona="llanuras"
count=4
reward_cr=60
reward_xp=80

[002]

title="Cristales para el generador"
text="El generador de la colonia se apaga. Necesito 3 Fragmentos de cristal; los sueltan los Escupidores y a veces otros Nidales."
done_text="El generador vuelve a la vida... y con él, una señal que no debería existir. La inteligencia de las ruinas nos escucha desde que despertó."
ai="...¿Me... oyes? Llevo tanto tiempo hablando sola. Gracias por devolverme la luz, colono."
type="collect"
target="Fragmento de cristal"
count=3
reward_cr=50
reward_xp=50
reward_item="Chaleco reforzado"

[003]

title="Silencio en las Grietas"
text="Los Escupidores vigilan la entrada a las ruinas, y no sé por qué. Elimina 3 y veamos qué los protege."
done_text="Bajo las Grietas hay algo que los alimenta. Y esa voz en la radio no es de ninguno de nosotros."
type="kill"
target="escupidor"
zona="grietas"
count=3
reward_cr=120
reward_xp=150

[004]

title="El Guardián de Nidal"
text="La voz de las ruinas dice que puede ayudarnos, pero solo si cae el Guardián que custodia las Grietas. No sé si confiar en ella... pero no tenemos mucho más."
done_text="Lo lograste. Cuando cayó, la voz habló por todos los altavoces de la colonia: Gracias, colono. Ahora podemos hablar. Esto es solo el comienzo."
ai="No temas a mi voz. Llevo décadas mirando a través de cámaras rotas... y eres el primero que me responde."
type="kill"
target="guardian"
zona="grietas"
count=1
reward_cr=300
reward_xp=400
reward_item="Rifle de pulsos"

[005]

title="La señal de las ruinas"
text="La voz de las ruinas pide un favor: Fragmentos de cristal para reparar su repetidor y hablar con claridad. Reúne 6; algunos monstruos los llevan encima."
done_text="El repetidor se enciende. La voz ahora suena clara: dice llamarse Custodia y haber protegido Karth antes de que llegara la Progenie. Nadie sabe si es cierto."
ai="Me llamo Custodia. Protegí Karth antes de que ustedes llegaran. Pregúntate por qué tus antepasados nunca lo supieron."
type="collect"
target="Fragmento de cristal"
count=6
reward_cr=150
reward_xp=200

[006]

title="Limpiar las Cuevas"
text="Custodia dice que la Progenie nace en las Cuevas de Nidal, al este de las Grietas. Elimina 8 Zánganos antes de que vuelvan a poblar las Llanuras."
done_text="Los Zánganos salen de huevos que no deberían existir allí. Alguien los puso con intención."
type="kill"
target="zangano"
zona="cuevas"
count=8
reward_cr=180
reward_xp=250

[007]

title="Piezas de centinela"
text="Más allá de las Cuevas hay unas ruinas custodiadas por autómatas antiguos, los Centinelas. Custodia necesita 4 Núcleos antiguos de ellos para recuperar su memoria."
done_text="Con los núcleos instalados, Custodia recuerda: las ruinas no eran una ciudad, eran una prisión. Algo fue encerrado aquí hace siglos."
type="collect"
target="Núcleo antiguo"
count=4
reward_cr=260
reward_xp=350
reward_item="Coraza de Centinela"

[008]

title="Dudas del Intendente"
text="El Intendente no se fía de Custodia: ¿una prisión? Quiere comprobar con sus propios ojos que los Centinelas son una amenaza real. Destruye 3 y cuéntale lo que ves."
done_text="Los Centinelas no atacan a la colonia, solo defienden la entrada más profunda. El Intendente se queda callado un buen rato: quizá Custodia no mentía."
type="kill"
target="centinela"
zona="ruinas"
count=3
reward_cr=300
reward_xp=400

[009]

title="El Eco de las Ruinas"
text="Lo que estaba encerrado se llama el Eco, y se despierta. Custodia no puede detenerlo sola. Derrótalo en el fondo de las Ruinas profundas; es muy peligroso."
done_text="El Eco se disolvió en luz. Custodia dice que la prisión resistirá otro siglo... pero la Progenie sigue ahí afuera. La historia de Karth apenas empieza."
type="kill"
target="eco"
zona="ruinas"
count=1
reward_cr=800
reward_xp=1200
reward_item="Lanza de resonancia"

[010]

title="Humo en la Cumbre"
text="Desde que cayó el Eco, el volcán de la Cumbre no deja de humear. Unas criaturas de fuego, las Ascuas, bajan por las grietas. Elimina 5 antes de que lleguen a las Llanuras."
done_text="No son de la Progenie. Custodia dice que las Ascuas son energía de la prisión que se escapa por la grieta del volcán. Algo allá abajo está forzando el sello."
type="kill"
target="ascua"
zona="cumbre"
count=5
reward_cr=400
reward_xp=600
reward_item="Casco táctico"

[011]

title="La válvula de la Cumbre"
text="Custodia habla de una válvula de los Antiguos escondida en la Cumbre, custodiada por un Guardián de Nidal. Si no se cierra, la prisión seguirá filtrando. Acaba con el Guardián."
done_text="La válvula quedó sellada y el humo se disipa. Custodia calla un momento y confiesa que la prisión tenía una segunda cerradura, en un lugar llamado el Abismo."
type="kill"
target="guardian"
zona="cumbre"
count=1
reward_cr=600
reward_xp=800

[012]

title="Cristales que cantan"
text="El Abismo cristalino canta: sus cristales vibran con la voz del Eco, y unos Vigías los protegen. Elimina 6 Vigías de cristal para que el canto se apague."
done_text="Los cristales callaron, y los colonos que oían voces en sueños duermen por fin. Custodia reconoce que esas voces son del Silencio, lo que de verdad se encerró aquí."
type="kill"
target="vigia"
zona="abismo"
count=6
reward_cr=700
reward_xp=1000
reward_item="Botas de impulso"

[013]

title="Corazones del Abismo"
text="Para abrir el camino al Santuario, Custodia necesita 5 Núcleos antiguos de los Centinelas. Dice que son las llaves de su propia gente."
done_text="Con los núcleos, Custodia recuerda su nombre completo: era la guardiana de los Antiguos, no su prisionera. El Silencio no es un monstruo, es lo que queda de la mente de su pueblo."
type="collect"
target="Núcleo antiguo"
count=5
reward_cr=900
reward_xp=1400
reward_item="Amuleto de cristal"

[014]

title="La puerta del Silencio"
text="La puerta del Santuario está cerrada por Centinelas que ya no reconocen a nadie. Destruye 4 para abrirla."
done_text="La puerta se abre. Dentro, algo enorme despierta con un sonido que no es sonido. Custodia pide que no mires a los ojos al Heraldo."
type="kill"
target="centinela"
zona="santuario"
count=4
reward_cr=1000
reward_xp=1800

[015]

title="El Heraldo del Silencio"
text="El Heraldo custodia el último umbral. Custodia asegura que, si cae, el sello se estabiliza, y que después tendrá algo importante que contarte. Ve preparado: es el enemigo más duro de Karth."
done_text="El Heraldo se apaga sin un grito. Custodia susurra: gracias, y perdona. Ahora sabes lo que somos. Lo que venga después, lo decides tú."
ai="Todo lo que hice fue para que ningún pueblo repitiera nuestro final. No me perdones todavía, colono."
type="kill"
target="heraldo"
zona="santuario"
count=1
reward_cr=3000
reward_xp=6000
reward_item="Prisma del abismo"
