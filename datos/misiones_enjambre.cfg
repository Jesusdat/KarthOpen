done_text="El Capitán cayó y el fortín se desordena. La voz volvió a hablar, más clara, desde las antenas de los humanos."
ai="No nacieron para odiarlos. Pero ellos no deben quedarse. Escúchenme y nadie más tendrá que morir... casi nadie."
