done_text="Los huevos laten. Al tocar el cristal, toda la colmena oyó lo mismo: una voz que nos llama por nuestro nombre."
ai="...Pequeños. Por fin despiertan. Yo puse sus huevos en Karth hace mucho, para un día como este."
