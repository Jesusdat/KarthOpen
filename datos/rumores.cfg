; Lo que comentan los NPC sobre lo que pasó hace poco en el mundo.
; Cada sección es un tipo de hecho y lleva una lista de frases; se usa una al azar.
; Puedes escribir las que quieras. Palabras que se reemplazan solas:
;   {zona}     nombre de la zona            {hace}    "hace 3 minutos"
;   {faccion}  "la Progenie", "los colonos" o "los Antiguos"
;   {jugador}  quien mató al jefe           {jefe}    nombre del jefe
;   {clima}    "tormenta de ceniza", etc.   {region}  región por donde pasó

[cae]
frases=["Dicen que {faccion} tomó {zona} {hace}.", "{zona} cayó {hace}. Ahora ahí manda {faccion}.", "¿Supiste que {faccion} entró a {zona} {hace}? Nadie pudo frenarlo."]

[vuelve]
frases=["{zona} volvió a manos de {faccion} {hace}.", "Ya se calmó {zona}: {faccion} la recuperó {hace}."]

[rechazada]
frases=["{faccion} intentó tomar {zona} {hace}. No pasaron.", "Hubo pelea en {zona} {hace}: {faccion} quiso entrar y lo sacaron."]

[jefe]
frases=["{jugador} acabó con {jefe} en {zona} {hace}.", "Cuentan que {jefe} cayó {hace} en {zona}. Fue {jugador}."]

[clima]
frases=["{hace} hubo {clima} en {region}.", "Por {region} todavía hablan de lo de {hace}: {clima}."]
