; Terreno de prueba generado (mientras no exista el editor de terreno).
; El terreno es una malla de alturas cortada en bloques; un metro por casilla.

[generador]
semilla=1337
bloques=8              ; bloques por lado (8 × 64 m = 512 m)
tamano_bloque=64       ; casillas por bloque
altura_maxima=55.0
frecuencia=0.0032
octavas=5
llano_inicio=40.0      ; radio (m) del llano alrededor del punto de inicio
borde=24.0             ; ancho (m) de la subida en la orilla del mapa

[props]
bioma="llanura"
cantidad=420
pendiente_maxima=0.55  ; no pone objetos en laderas más empinadas (0 = plano, 1 = 45°)
radio_libre=14.0       ; deja libre el centro del llano de inicio
escala_base=1.9       ; Karth medía 1 casilla = 1.9 m; aquí 1 unidad = 1 m
escala_min=0.85
escala_max=1.35
